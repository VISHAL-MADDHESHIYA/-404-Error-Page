<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="error-container">
        <div class="error-content">
            
            <!-- Custom SVG Illustration -->
            <div class="error-illustration">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
                    <circle cx="40" cy="40" r="3" fill="#CBD5E1" class="star star-1"/>
                    <circle cx="160" cy="60" r="2" fill="#CBD5E1" class="star star-2"/>
                    <circle cx="30" cy="140" r="2" fill="#CBD5E1" class="star star-3"/>
                    <circle cx="170" cy="150" r="3" fill="#CBD5E1" class="star star-4"/>
                    
                    <circle cx="100" cy="100" r="60" fill="url(#planet-gradient)" />
                    
                    <ellipse cx="100" cy="100" rx="90" ry="25" stroke="#818CF8" stroke-width="6" transform="rotate(-15 100 100)" stroke-linecap="round" class="ring"/>
                    
                    <g class="satellite">
                        <rect x="85" y="60" width="30" height="20" rx="4" fill="#F8FAFC" />
                        <rect x="60" y="65" width="25" height="10" rx="2" fill="#4F46E5" />
                        <rect x="115" y="65" width="25" height="10" rx="2" fill="#4F46E5" />
                        <path d="M95 80 L105 80 L100 90 Z" fill="#F8FAFC" />
                        <circle cx="100" cy="70" r="3" fill="#EF4444" />
                    </g>

                    <defs>
                        <linearGradient id="planet-gradient" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#4F46E5" />
                            <stop offset="1" stop-color="#312E81" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <h1 class="error-code">404</h1>
            <h2 class="error-title">Lost in space?</h2>
            <p class="error-message">
                The page you are looking for has drifted out of orbit. 
                It might have been moved, deleted, or perhaps it never existed.
            </p>

            <!-- Yahan index.html se link kar diya gaya hai -->
            <a href="index.html" class="home-button" aria-label="Return to homepage">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Back to Homepage
            </a>

        </div>
    </main>

</body>
</html>
